name: Compiler l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Même clé de signature d'une version à l'autre : permet d'installer les mises à jour par-dessus.
      - name: Récupérer la clé de signature
        uses: actions/cache@v4
        with:
          path: signature/cuizinote.jks
          key: signature-widget-cuizinote-v2

      - name: Créer la clé de signature (première fois seulement)
        run: |
          if [ ! -f signature/cuizinote.jks ]; then
            mkdir -p signature
            keytool -genkeypair -keystore signature/cuizinote.jks -alias cuizinote \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass cuizinote -keypass cuizinote -dname "CN=Widget Cuizinote"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compiler
        env:
          CLE_SIGNATURE: ${{ github.workspace }}/signature/cuizinote.jks
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renommer
        run: cp app/build/outputs/apk/release/app-release.apk widget-cuizinote.apk

      - uses: actions/upload-artifact@v4
        with:
          name: widget-cuizinote
          path: widget-cuizinote.apk

      - name: Publier la version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" widget-cuizinote.apk \
            --title "Widget Cuizinote 1.0.${{ github.run_number }}" \
            --notes "Téléchargez widget-cuizinote.apk sur votre téléphone Android pour l'installer." \
            --latest
